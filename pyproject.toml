[project]
name = "simple-permutation-parity"
version = "0.1.2"
description = "Determines whether a permutation is even or odd, given either in one-line notation or as a list of cycle lengths."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
